ading-6 ${K}`,children:"A SEFIN Nacional exige mTLS (client certificate) na Distribuição DFe e na transmissão DPS. O fetch do browser não permite anexar PFX nem controlar TLS handshake. Por isso, em produção, use um proxy Node.js que faz a ponte: frontend envia XML já assinado + gzipBase64, proxy usa https.Agent com pfx e senha para autenticar no endpoint oficial."})]}),S("div",{className:`rounded-[16px] border ${ne} p-0 overflow-hidden`,children:[S("div",{className:"p-4 flex justify-between items-center",children:[h("h4",{className:"font-semibold text-[13px]",children:"proxy-mtls.js - Código Node.js para produção"}),h("span",{className:"text-[10px] px-2 py-1 rounded-full bg-[#10b981] text-white",children:"express + https"})]}),h("pre",{className:`p-4 overflow-auto max-w-full text-[11px] font-mono leading-5 whitespace-pre-wrap break-all ${W?"bg-[#070b10] text-[#a7f3d0]":"bg-[#0f172a] text-[#a7f3d0]"}`,children:`// npm i express cors https fs
import express from 'express';
import https from 'https';
import fs from 'fs';

const app = express();
app.use(express.json({limit:'5mb'}));
app.use((_,res,next)=>{ res.header('Access-Control-Allow-Origin','*'); res.header('Access-Control-Allow-Headers','Content-Type'); next(); });

// Endpoint que recebe XML assinado do frontend
app.post('/api/nfse/enviar', async (req,res)=>{
  const { xmlAssinado, cnpj } = req.body; // xmlAssinado = assinarXmlDPS() no browser
  const pfx = fs.readFileSync('./certs/'+cnpj+'.pfx');
  const agent = new https.Agent({ pfx, passphrase: process.env.PFX_PASS, rejectUnauthorized:true });

  // GZIP + Base64 conforme leiaute nacional
  const gz = Buffer.from(xmlAssinado).toString('base64'); // use pako.gzip em produção real

  const resp = await fetch('https://sefin.nacional.nfse.gov.br/sefin/api/v1/dps', {
    method:'POST',
    // @ts-ignore - Node fetch com agent mTLS
    agent,
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ dpsXmlGzipB64: gz })
  });
  const data = await resp.json();
  res.json(data);
});

// Distribuição DFe em lote - consulta + download
app.post('/api/nfse/distribuicao', async (req,res)=>{
  const { cnpj, dataInicio, dataFim, nsu } = req.body;
  const pfx = fs.readFileSync('./certs/'+cnpj+'.pfx');
  const agent = new https.Agent({ pfx, passphrase: process.env.PFX_PASS });

  // loop com retry 3x + backoff, concorrência 5
  const fetchLote = async (params) => {
    for(let r=0;r<3;r++){
      try{
        const r = await fetch('https://sefin.nacional.nfse.gov.br/sefin/api/v1/dfe', { agent, method:'POST', body: JSON.stringify(params) });
        if(!r.ok) throw new Error('HTTP '+r.status);
        return await r.json();
      }catch(e){ if(r===2) throw e; await new Promise(s=> setTimeout(s, 300*Math.pow(2,r))); }
    }
  };
  const result = await fetchLote({ cnpj, dataInicio, dataFim, nsu });
  res.json(result);
